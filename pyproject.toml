[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-session-recommender"
version = "0.1.0"
description = "Course project for an adaptive session-aware product recommender"
requires-python = ">=3.11"
dependencies = [
    "pyspark==3.5.8",
]

[tool.setuptools.packages.find]
where = ["src"]

