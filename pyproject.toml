[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-session-recommender"
version = "0.1.0"
description = "Course project for an adaptive session-aware product recommender"
requires-python = ">=3.11"
dependencies = [
    "numpy==1.26.4",
    "pyspark==3.5.8",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
    "pyarrow>=15.0.0,<19.0.0",
    "cassandra-driver>=3.29.0",
    "kafka-python-ng>=2.2.2",
]

[tool.setuptools.packages.find]
where = ["src"]

